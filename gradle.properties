# # # # # # # # # # # # # #
#    Project Properties   #
# # # # # # # # # # # # # #

# Gradle Settings
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true

# Mossy Plugin
mossy_plugin_version = 4.10.0

# Data Properties
data.mod_id = fast_recipe
data.mod_slug = fast-recipe
data.mod_name = Fast Recipe
data.mod_jar_name = fast-recipe
data.mod_version = 1.0.3
data.mod_group = me.zipestudio.fastrecipe
data.mod_maven_group = me.zipestudio
data.mixin_configs = none
data.sides = client

data.mod_description = Adds quick crafting in the recipe book. Press [Ctrl + LMB] on a recipe to craft it instantly.
data.mod_authors = ZipeStudio
data.github_author = ZipeStudio
data.mod_license = CC-BY-ND 4.0

# Base Properties
base.lombok_version = 1.18.42
base.mixinextras_version = 0.4.1
base.mixin_version = 0.8.5

# Per-Loader Versions
fabric.multi_versions = 1.17 1.18.2 1.19.2 1.19.4 1.20.1 1.20.4 1.21.1 1.21.4 1.21.11 26.1 26.2 26.3
neoforge.multi_versions = 1.21.1 1.21.4 1.21.11 26.1 26.2 26.3
forge.multi_versions = 1.20.1

# Mod Loaders
mod_loaders = fabric neoforge forge

# Build Properties
build.fabric_loader = 0.19.3
build.fabric_api = [VERSIONED]
build.neoforge = [VERSIONED]
build.parchment = [VERSIONED]
build.forge = [VERSIONED]

# Additional Dependencies, "dep." is important

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

# Supported Versions, 1.21[1] -> 1.21-1.21.1
fabric.versions_specifications = 1.21.10 26.1[26.1.2] 26.2 26.3
neoforge.versions_specifications = 1.21.10 26.1[26.1.2] 26.2 26.3
forge.versions_specifications = 1.21.10

# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs
modrinth_id = yItp8TXg
curseforge_id = 1069070

# CurseForge Settings
is_for_client = true
is_for_server = false
max_java_version = 21

# Fabric Dependencies
fabric.depends_requires = fabric-api
fabric.depends_optional = none
fabric.depends_incompatible = none
fabric.depends_embeds  = none

# NeoForge Dependencies
neoforge.depends_requires = none
neoforge.depends_optional = none
neoforge.depends_incompatible = none
neoforge.depends_embeds  = none

# Forge Dependencies
forge.depends_requires = none
forge.depends_optional = none
forge.depends_incompatible = none
forge.depends_embeds  = none

# Stonecutter Stuff
dev.kikugie.stonecutter.hard_mode=true
